name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # An older Ubuntu keeps the bundles compatible with more glibc versions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libdbus-1-dev libxdo-dev pkg-config \
            build-essential curl wget file patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Frontend tests
        run: npm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Backend tests
        working-directory: src-tauri
        run: cargo test --locked || cargo test

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build bundles
        run: npx tauri build

      - uses: actions/upload-artifact@v5
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: linux-bundles
          path: bundles

      - name: Install the .deb and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick dbus-x11 at-spi2-core
          sudo apt-get install -y ./bundles/deb/*.deb

      - name: Smoke test
        run: bash tests/smoke.sh bundles smoke-out

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: smoke-out
